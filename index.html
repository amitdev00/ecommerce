<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      "
    >
      <div
        style="
          background: #f9f9f9;
          padding: 32px 24px;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
          min-width: 320px;
        "
      >
        <h2 style="text-align: center; margin-bottom: 24px">Login</h2>
        <form>
          <div style="margin-bottom: 16px">
            <label for="email" style="display: block; margin-bottom: 6px"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              required
              style="
                width: 100%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
              "
            />
          </div>
          <div style="margin-bottom: 20px">
            <label for="password" style="display: block; margin-bottom: 6px"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              required
              style="
                width: 100%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
              "
            />
          </div>
          <button
            type="submit"
            style="
              width: 100%;
              padding: 10px;
              background: #007bff;
              color: #fff;
              border: none;
              border-radius: 4px;
              font-size: 16px;
            "
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
